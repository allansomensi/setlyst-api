[package]
name = "setlyst-api"
version = "0.15.0"
authors = ["Allan Somensi <allansomensidev@proton.me>"]
description = "A simple REST API for setlist management."
homepage = "https://github.com/allansomensi/setlyst-api"
repository = "https://github.com/allansomensi/setlyst-api"
readme = "README.md"
keywords = ["api"]
edition = "2024"
license = "MIT"
default-run = "setlyst-api"

[[bin]]
name = "create_superuser"
path = "src/bin/create_superuser.rs"

[dependencies]
argon2 = { version = "0.6", features = ["password-hash", "getrandom"] }
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
    "uuid",
] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
thiserror = "2"
tokio = { version = "1.52", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.7", features = [
    "catch-panic",
    "cors",
    "set-header",
    "compression-full",
    "timeout",
    "trace",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum"] }
uuid = { version = "1.23", features = ["serde", "v4", "v7"] }
validator = { version = "0.21", features = ["derive"] }
tower_governor = { version = "0.8", features = ["tracing"] }
genpdf = "0.2.0"
serde_json = "1"
serde_urlencoded = "0.7"
aes-gcm = "0.11"
base64 = "0.23"
hkdf = "0.13"
hmac = "0.13"
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
    "form",
    "json",
    "query",
    "rustls-no-provider",
] }
rpassword = "7"
# The TLS provider reqwest uses (the same `ring` lettre already builds).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"
unicode-normalization = "0.1"

# Production binaries: whole-program optimisation and a single codegen
# unit cost build time once and make the hot paths (JSON, SQL decoding,
# compression, PDF layout) measurably faster. Panics keep unwinding so
# `CatchPanicLayer` can turn a panicking handler into a 500 instead of
# taking the process down.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dev-dependencies.cargo-husky]
version = "1.5"
default-features = false
features = [
    "run-for-all",
    "prepush-hook",
    "precommit-hook",
    "run-cargo-test",
    "run-cargo-clippy",
    "run-cargo-fmt",
]
