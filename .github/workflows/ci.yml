name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New advisories appear without any change here: check weekly too.
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Fail instead of skipping when the database isn't reachable.
      REQUIRE_TEST_DATABASE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets

      - name: Tests
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Plain `cargo audit` rather than rustsec/audit-check: no check-run
      # permission needed (that action failed with "Resource not accessible
      # by integration"). Ignored advisories, each with its reason, live in
      # .cargo/audit.toml; unmaintained crates are reported as warnings.
      - name: Audit dependencies
        run: cargo audit
